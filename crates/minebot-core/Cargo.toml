[package]
name = "minebot-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
toml = "0.8"
dirs = "5"
thiserror = "1"
tracing = "0.1"

[[example]]
name = "ping"
